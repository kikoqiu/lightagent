name: Go Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]          # 当推送形如 v1.0.0 的 tag 时触发
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:         # 允许在网页手动点击运行

# 必须设置权限：允许 Actions 创建 Release 并上传文件
permissions:
  contents: write

env:
  APP_NAME: ""
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run Tests
        run: go test -v ./...

      - name: Cross Compile Binaries
        run: |
          APP_NAME="${APP_NAME:-${{ github.event.repository.name }}}"
          OUT_DIR="build"
          mkdir -p "$OUT_DIR"

          export CGO_ENABLED=0
          export GOFLAGS="-trimpath"
          
          LDFLAGS="-s -w"
          if [ -n "$VERSION" ]; then
            LDFLAGS="$LDFLAGS -X main.version=$VERSION"
          fi

          echo "============================================================"
          echo " app     : $APP_NAME"
          echo " output  : $OUT_DIR"
          echo " version : $VERSION"
          echo "============================================================"

          TARGETS=(
            "darwin/arm64"
            "darwin/amd64"
            "linux/amd64"
            "linux/arm64"
            "linux/arm/7"
            "linux/386"
            "windows/amd64"
            "windows/arm64"
            "windows/386"
          )

          for target in "${TARGETS[@]}"; do
            IFS='/' read -r os arch arm <<< "$target"
            
            ext=""
            [ "$os" = "windows" ] && ext=".exe"

            bin_name="${APP_NAME}-${os}-${arch}${arm}${ext}"
            out_path="${OUT_DIR}/${bin_name}"

            echo "[build] ${os}/${arch} ${arm:+GOARM=$arm} -> ${bin_name}"

            if [ -n "$arm" ]; then
              GOOS=$os GOARCH=$arch GOARM=$arm go build -ldflags "$LDFLAGS" -o "$out_path" .
            else
              GOOS=$os GOARCH=$arch go build -ldflags "$LDFLAGS" -o "$out_path" .
            fi
          done

          # 生成校验和
          cd "$OUT_DIR"
          sha256sum * > sha256sums.txt
          cd - > /dev/null

      # 每次构建都保留一份内部工件（开发调试用）
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-binaries
          path: build/

      # -------------------------------------------------------------
      # 核心：只有在推送 Git Tag 时，才会自动创建并发布 GitHub Release
      # -------------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/*
          generate_release_notes: true  # 自动提取从上次发布以来的 Commit 作为更新日志
          draft: false                  # 是否设为草稿（false 表示直接正式发布）
          prerelease: true             # 是否为预览版
